<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">
    <link
        rel="stylesheet"
        href="https://uicdn.toast.com/editor/latest/toastui-editor.min.css"
    >
</head>

<body>

<div id="app">

    <aside id="sidebar">

        <!-- GitHub connection -->
        <section id="connection">

            <input
                id="token"
                type="password"
                placeholder="GitHub admin token"
                autocomplete="off"
            >

            <div class="button-row">
                <button onclick="connect()">Connect</button>

                <button class="secondary" onclick="clearToken()">
                    Forget token
                </button>
            </div>

            <div id="status" role="status"></div>

        </section>

        <!-- Post details -->
        <section id="post-info">

            <h2>Post details</h2>

            <label for="post-name">Post title</label>
            <input
                id="post-name"
                type="text"
                placeholder="My First Post"
                oninput="updateFilePath()"
            ><br><br>

            <label for="author">Author</label>
            <input
                id="author"
                type="text"
                placeholder="Author name"
            ><br><br>

            <label for="description">Description</label>
            <textarea
                id="description"
                rows="3"
                placeholder="Brief description of the post"
            ></textarea><br><br>

            <label for="categories">Categories</label>
            <input
                id="categories"
                type="text"
                placeholder="News, School"
            >

            <div class="field-hint">
                Separate multiple categories and tags with commas.
            </div><br>

            <div class="file-info">
                <strong>File path</strong>
                <div id="file-path">
                    blog/YYYY-MM-DD-post-name.md
                </div>
            </div>

            <p>gunakan laptop/komputer untuk memudahkan proses <br>(HP juga bisa tapi agak ribet)</p>

        </section>

    </aside>

    <!-- Editor -->
    <main id="main">

        <div id="editor-container">
            <div id="editor"></div>
        </div>

        <div id="bottom-bar">

            <button onclick="saveFile()">
                Publish
            </button>

        </div>
    </main>

</div>

<script src="https://uicdn.toast.com/editor/latest/toastui-editor-all.min.js"></script>
<script src="script.js"></script>

</body>
</html>
